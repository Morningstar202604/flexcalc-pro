name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # 构建失败过一次：类型检查与构建必须在 CI 里跑，不能只靠本地手测
      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # 规则文件是产品主张的一部分，缺出处或 verified 误标都要挡住。
      # 校验逻辑放在 scripts/check-rules.mjs：此前内联在本文件里，
      # 脚本中的「冒号+空格」被 YAML 当作映射键值，导致 workflow 语法错误、
      # CI 从未真正启动。抽出后 workflow 只调用，本地也能跑同一条门禁。
      - name: Rule files are valid JSON with provenance
        run: node scripts/check-rules.mjs

      - name: Engine self-check (net income identity)
        run: npm run verify

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
